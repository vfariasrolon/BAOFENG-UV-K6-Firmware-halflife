; PlatformIO Project Configuration File
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env]
; build_type = debug
build_type = release
debug_load_mode = modified
platform = openradiox
framework = cmsis
; upload_protocol = cmsis-dap
; debug_tool = cmsis-dap
; --- Fase 1: Heartbeat Minimalista ---
; Solo compila el scheduler (main, AppTask) y el motor de menú (AppMenu).
; Common/stubs.c provee todas las dependencias externas como funciones vacías.
; Para restaurar la build completa: reemplazar por +<*> y agregar -<> de exclusión.
build_src_filter =
	+<App/main.c>
	+<App/AppTask.c>
	+<Common/stubs.c>
board_build.ldscript = kd32f328xb.ld
; Directorios con contenido real (Fase 1):
;   src/App     → main.c, AppTask.c, AppMenu.c
;   src/Common  → stubs.c
;   src/Gui     → DisplayMenu.h
; Eliminados: BSP, Core, CPS, Interface, Libraries, Voice (vacíos en minifirm)
build_flags =
	-Isrc/App
	-Isrc/Common
	-Isrc/Gui
	-Isrc/Driver/inc

[env:BaoFeng-UV-K6x]
board = BaoFeng-UV-K6x
build_flags = ${env.build_flags}
extra_scripts = post:post_build.py